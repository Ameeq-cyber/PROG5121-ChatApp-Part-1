name: Java CI with Maven

on:
  push:
    branches: [ "main", "master", "CHAT-APP-PART-3" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21' # Change to '25' only if your pom.xml explicitly requires Java 25
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'ChatAppPart1/pom.xml'

      - name: Build and run tests with Maven
        run: mvn -f ChatAppPart1/pom.xml clean test
